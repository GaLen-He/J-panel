<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J-panel 功能演示</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1a1d25;
      --panel-2: #222733;
      --text: #f3f4f8;
      --muted: #aeb6c7;
      --line: #333949;
      --accent: #70d6b4;
      --accent-2: #f2b35d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.55;
    }

    a {
      color: inherit;
      text-decoration-color: var(--accent);
      text-underline-offset: 4px;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: #151820;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 46px 0 34px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.05;
      font-weight: 760;
      letter-spacing: 0;
    }

    .lead {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      white-space: nowrap;
    }

    main {
      padding: 34px 0 56px;
    }

    .video-list {
      display: grid;
      gap: 28px;
    }

    .feature {
      display: grid;
      grid-template-columns: minmax(240px, 0.34fr) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .feature h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .feature p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 14px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(112, 214, 180, 0.16);
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
    }

    .feature:nth-child(2) .tag {
      background: rgba(242, 179, 93, 0.16);
      color: var(--accent-2);
    }

    .media {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0a0c10;
    }

    footer {
      padding: 28px 0 40px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .hero,
      .feature {
        grid-template-columns: 1fr;
      }

      .repo-link {
        width: fit-content;
      }

      .feature {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell hero">
      <div>
        <h1>J-panel 功能演示</h1>
        <p class="lead">面向 Blender 的快捷操作面板演示页，展示切割工具、曲线倒角和陈列功能的实际操作效果。</p>
      </div>
      <a class="repo-link" href="https://github.com/GaLen-He/J-panel">打开 GitHub 仓库</a>
    </div>
  </header>

  <main class="shell">
    <section class="video-list" aria-label="功能演示视频">
      <article class="feature">
        <div>
          <span class="tag">Cut Tool</span>
          <h2>切割工具</h2>
          <p>演示 J-panel 中切割相关操作的调用方式和实际切割效果。</p>
        </div>
        <div class="media">
          <video controls preload="metadata" playsinline src="assets/videos/cut-tool.mp4"></video>
        </div>
      </article>

      <article class="feature">
        <div>
          <span class="tag">Curve Bevel</span>
          <h2>曲线倒角</h2>
          <p>演示曲线倒角功能的工作流程，方便快速确认参数调整后的结果。</p>
        </div>
        <div class="media">
          <video controls preload="metadata" playsinline src="assets/videos/curve-bevel.mp4"></video>
        </div>
      </article>

      <article class="feature">
        <div>
          <span class="tag">Arrange</span>
          <h2>陈列功能</h2>
          <p>演示自动陈列相关逻辑，展示物体排列、间距和布局调整效果。</p>
        </div>
        <div class="media">
          <video controls preload="metadata" playsinline src="assets/videos/array-demo.mp4"></video>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <div class="shell">J-panel 演示视频由仓库内 GitHub Pages 页面直接加载，可在浏览器中预览播放。</div>
  </footer>
</body>
</html>
